# Admin — Cloudflare Workers, projet distinct du front public (apps/frontend).
# Exposée publiquement (derrière l'auth applicative), mais découplée du
# déploiement du site : domaines/sous-domaines séparés, cycles de vie séparés.
# @astrojs/cloudflare v13+ (Astro 6+) a supprimé le support de Cloudflare
# Pages ; ce projet déploie désormais sur Workers (`wrangler deploy`).
name = "edge-cmf-admin"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# Service Bindings vers les mêmes micro-workers internes que le front
# (cahier v3 §3). Latence < 2ms, aucun passage par le réseau HTTP public.
[[services]]
binding = "CONTENT_WORKER"
service = "content-worker"

[[services]]
binding = "AUTH_WORKER"
service = "auth-worker"

[[services]]
binding = "MEDIA_WORKER"
service = "media-worker"

# ---------------------------------------------------------------------------
# Workers Logs — désactivé par défaut chez Cloudflare, donc à activer
# explicitement. Sans ça, toute erreur avalée (échec d'un `waitUntil`, `catch`
# muet, exception non gérée) est structurellement invisible en production :
# on ne peut pas déboguer ce qu'on ne voit pas.
# ---------------------------------------------------------------------------
[observability]
enabled = true
head_sampling_rate = 1
