# Front-End Astro SSR — Cloudflare Pages (SEULE ENTITÉ EXPOSÉE PUBLIQUEMENT)
name = "edge-cmf"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"

# Service Bindings vers les micro-workers internes (cahier v3 §3)
# Latence < 2ms, aucun passage par le réseau HTTP public.
[[services]]
binding = "CONTENT_WORKER"
service = "content-worker"

[[services]]
binding = "AUTH_WORKER"
service = "auth-worker"
