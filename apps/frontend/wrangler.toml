# Front-End Astro SSR — Cloudflare Workers (site public uniquement).
# @astrojs/cloudflare v13+ (Astro 6+) a supprimé le support de Cloudflare
# Pages ; ce projet déploie désormais sur Workers (`wrangler deploy`).
# `main`/`assets`/`compatibility_date` par défaut sont injectés
# automatiquement par l'adaptateur si absents ; on les déclare ici pour
# rester explicite et déterministe.
# L'admin est un projet Cloudflare Workers distinct (apps/admin/wrangler.toml).
name = "edge-cmf"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# Service Binding vers le content-worker interne (cahier v3 §3). Latence
# < 2ms, aucun passage par le réseau HTTP public. Le front n'a pas besoin
# de l'auth-worker : aucune mutation, aucune session ici.
[[services]]
binding = "CONTENT_WORKER"
service = "content-worker"

# Diffusion publique des médias R2 via /media/* (lecture seule).
[[services]]
binding = "MEDIA_WORKER"
service = "media-worker"

# Lecture des tags de cache (page cache à la Drupal : ETag/304 + cache edge
# du HTML, invalidés par les versions de tags écrites par les workers).
[[kv_namespaces]]
binding = "CACHE_KV"
id = "a8b2d2ae1d5143b3abb8f5426ff69183"
