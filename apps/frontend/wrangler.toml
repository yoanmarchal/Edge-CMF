# Front-End Astro SSR — Cloudflare Pages (site public uniquement).
# L'admin est un projet Cloudflare Pages distinct (apps/admin/wrangler.toml).
name = "edge-cmf"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"

# Service Binding vers le content-worker interne (cahier v3 §3). Latence
# < 2ms, aucun passage par le réseau HTTP public. Le front n'a pas besoin
# de l'auth-worker : aucune mutation, aucune session ici.
[[services]]
binding = "CONTENT_WORKER"
service = "content-worker"
