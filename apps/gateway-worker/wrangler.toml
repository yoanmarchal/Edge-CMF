# API Gateway — SEUL WORKER BACK-END EXPOSÉ PUBLIQUEMENT
# API REST headless en lecture seule pour consommateurs externes
# (apps mobiles, autres front-ends, intégrations tierces).
name = "gateway-worker"
main = "src/index.ts"
compatibility_date = "2025-06-01"

# Exposé sur *.workers.dev (ou ajouter des routes de domaine custom)
workers_dev = true

# Service Binding interne vers le contenu
[[services]]
binding = "CONTENT_WORKER"
service = "content-worker"

# Clés API des consommateurs : `wrangler kv key put --binding=API_KEYS "apikey:<clé>" "<nom-client>"`
[[kv_namespaces]]
binding = "API_KEYS"
# Remplacer après `wrangler kv namespace create API_KEYS`
id = "REMPLACER_PAR_ID_KV_API_KEYS"

# Même namespace KV que le content-worker (version de cache partagée)
[[kv_namespaces]]
binding = "CACHE_KV"
id = "a8b2d2ae1d5143b3abb8f5426ff69183"

# Variables :
# PUBLIC_API_OPEN = "1" désactive l'exigence de clé API (dev/démo uniquement)
[vars]
PUBLIC_API_OPEN = "0"

# Rate limiting natif Cloudflare (100 req / 60s par clé API)
[[unsafe.bindings]]
name = "RL"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 100, period = 60 }
