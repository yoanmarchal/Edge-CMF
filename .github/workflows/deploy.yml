# CI/CD Full-Stack Edge (cahier v3 §5)
# Ordre impératif : 1) Migrations D1  2) Micro-Workers  3) Cloudflare Pages
name: Deploy Edge CMF

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript strict — zéro any toléré
        run: npm run typecheck

  deploy:
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # 1. Les modifications de schémas (Migrations D1) s'exécutent en premier
      - name: Migrations D1 — content
        run: npx wrangler d1 migrations apply edge-cmf-content --remote
        working-directory: apps/content-worker
      - name: Migrations D1 — users
        run: npx wrangler d1 migrations apply edge-cmf-users --remote
        working-directory: apps/auth-worker

      # 2. Mise à jour des Micro-Workers Back-End
      - name: Deploy content-worker
        run: npx wrangler deploy
        working-directory: apps/content-worker
      - name: Deploy auth-worker
        run: npx wrangler deploy
        working-directory: apps/auth-worker
      - name: Deploy gateway-worker
        run: npx wrangler deploy
        working-directory: apps/gateway-worker

      # 3. Build et déploiement du front Astro sur Cloudflare Pages
      - name: Build Astro
        run: npm run build -w @edge-cmf/frontend
      - name: Deploy Cloudflare Pages
        run: npx wrangler pages deploy ./dist --project-name=edge-cmf
        working-directory: apps/frontend
