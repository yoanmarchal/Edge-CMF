# CI/CD Full-Stack Edge (cahier v3 §5)
# Ordre impératif : 1) Migrations D1  2) Micro-Workers  3) Workers Astro (front + admin)
name: Deploy Edge CMF

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript strict — zéro any toléré
        run: npm run typecheck

      # Les tests s'exécutent dans workerd (vitest-pool-workers), pas dans
      # Node : c'est la seule façon de vérifier des comportements de la
      # plateforme — limite de paramètres liés D1, transactions implicites de
      # `batch()`, en-têtes de la Cache API. Un test Node passerait au vert sur
      # du code qui casse en production.
      - name: Tests d'intégration (runtime Workers)
        run: npm test

  deploy:
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # 0. Validation à blanc de TOUTES les configurations avant de toucher à
      # quoi que ce soit. Sans cette étape, une erreur de configuration sur le
      # dernier worker (identifiant de namespace KV manquant, binding invalide)
      # n'était découverte qu'APRÈS l'application des migrations D1 et le
      # déploiement des workers précédents — production dans un état partiel,
      # sans procédure de retour.
      # Les deux apps Astro sont exclues : leur configuration n'est complète
      # qu'après `astro build`, elles sont validées à leur propre étape.
      - name: Validation à blanc des micro-workers
        shell: bash
        run: |
          set -euo pipefail
          for app in content-worker auth-worker media-worker gateway-worker; do
            echo "::group::dry-run $app"
            (cd "apps/$app" && npx wrangler deploy --dry-run --outdir "/tmp/dryrun/$app")
            echo "::endgroup::"
          done

      # 1. Les modifications de schémas (Migrations D1) s'exécutent en premier
      - name: Migrations D1 — content
        run: npx wrangler d1 migrations apply edge-cmf-content --remote
        working-directory: apps/content-worker
      - name: Migrations D1 — users
        run: npx wrangler d1 migrations apply edge-cmf-users --remote
        working-directory: apps/auth-worker

      # 2. Mise à jour des Micro-Workers Back-End
      - name: Deploy content-worker
        run: npx wrangler deploy
        working-directory: apps/content-worker
      - name: Deploy auth-worker
        run: npx wrangler deploy
        working-directory: apps/auth-worker
      - name: Deploy media-worker
        run: npx wrangler deploy
        working-directory: apps/media-worker
      - name: Deploy gateway-worker
        run: npx wrangler deploy
        working-directory: apps/gateway-worker

      # 3. Build + déploiement des deux Workers Astro (@astrojs/cloudflare v13+
      # ne supporte plus Cloudflare Pages — `wrangler deploy` uniquement)
      - name: Deploy frontend (Worker edge-cmf)
        run: npm run deploy -w @edge-cmf/frontend
      - name: Deploy admin (Worker edge-cmf-admin)
        run: npm run deploy -w @edge-cmf/admin
